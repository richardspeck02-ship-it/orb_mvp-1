name: orb-gen-retrieval
tagStrategies:
  predev:
    branches:
      - feature/*
      - hotfix/*
      - bugfix/*
    tags:
      - predev
      - latest
      - ${Major}.${Mino}-alpha.${CommitsSinceVersionSource}.${PreReleaseLabel}
  dev:
    branches:
      - develop
    tags:
      - stable
      - ${Major}.${Mino}-rc-${CommitsSinceVersionSource}.${PreReleaseLabel}
  # qa:
  #   branches:
  #     - qa
  #   tags:
  #     - qa
  release:
    branches:
      - main
    tags:
      - stable-${Major}.${Minor}.${Patch}
      - ${Major}.${Minor}.${Patch}
build: true
useDockerCache: true
artifactoryRepository: jfof-docker
changedContainersOnly: true
watchChangesInPaths:
  - retrieval_layer/.*
  - _scm_container/orb-gen-retrieval/.*
