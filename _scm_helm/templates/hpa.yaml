{{- if .Values.embeddingLayer.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "orb-generation.fullname" . }}-embedding-layer
  labels:
    {{- include "orb-generation.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "orb-generation.fullname" . }}-embedding-layer
  minReplicas: {{ .Values.embeddingLayer.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.embeddingLayer.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.embeddingLayer.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.embeddingLayer.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.embeddingLayer.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.embeddingLayer.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
