---
{{- if .Values.embeddingLayer.enabled }}
{{- if .Values.embeddingLayer.podDisruptionBudget }}
apiVersion: {{ include "orb-generation.podDisruptionBudget.apiVersion" . }}
kind: PodDisruptionBudget
metadata:
  name: {{ include "orb-generation.fullname" . }}-embedding-layer
  namespace: {{ include "orb-generation.namespace" . }}
  labels:
    {{- include "orb-generation.labels" . | nindent 4 }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.embeddingLayer.podDisruptionBudget.minAvailable }}
  minAvailable: {{ . }}
  {{- end }}
  {{- with .Values.embeddingLayer.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "orb-generation.selectorLabels" . | nindent 6 }}
      module: embedding-layer
{{- end }}
{{- end }}
