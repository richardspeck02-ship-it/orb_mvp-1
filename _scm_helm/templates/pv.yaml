apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.s3Mount.sharedVolumeName | default (include "orb-generation.fullname" .) }}
spec:
  capacity:
    storage: 1200Gi # Ignored, required
  accessModes:
    - ReadWriteMany
  storageClassName: "" # Required for static provisioning
  claimRef:
    namespace: {{ include "orb-generation.namespace" . }}
    name: {{ .Values.s3Mount.sharedClaimName | default (include "orb-generation.fullname" .) }}
  mountOptions:
    {{- with .Values.s3Mount.mountOptions }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  csi:
    driver: s3.csi.aws.com
    volumeHandle: {{ .Values.s3Mount.sharedVolumeHandle | default (include "orb-generation.fullname" .) }}
    volumeAttributes:
      bucketName: {{ .Values.s3Mount.sharedBucketName }}
---
