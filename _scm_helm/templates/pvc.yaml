apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name:
    {
      {
        default (include "orb-generation.fullname" $) .Values.s3Mount.sharedClaimName,
      },
    }
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 1200Gi
  volumeName:
    {
      {
        default (include "orb-generation.fullname" $) .Values.s3Mount.sharedVolumeName,
      },
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name:
    {
      {
        default (include "orb-generation.fullname" $) .Values.s3Mount.inputClaimName,
      },
    }
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 1200Gi
  volumeName:
    {
      {
        default (include "orb-generation.fullname" $) .Values.s3Mount.inputVolumeName,
      },
    }
