{{- if .Values.retrievalLayer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orb-generation.fullname" . }}-retrieval-layer
  labels:
    {{- include "orb-generation.labels" . | nindent 4 }}
    module: retrieval-layer
spec:
  {{- if not .Values.retrievalLayer.autoscaling.enabled }}
  replicas: {{ .Values.retrievalLayer.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "orb-generation.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "orb-generation.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        module: retrieval-layer
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "orb-generation.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          command:
            - python3
            - ./main.py
          envFrom:
            - secretRef:
                name: {{ .Values.appSecretsName }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.retrievalLayer.image.repository }}:{{ .Values.retrievalLayer.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.retrievalLayer.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.retrievalLayer.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/orb-generation
            - name: shared-volume
              mountPath: /models
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.configName }}
        - name: shared-volume
          persistentVolumeClaim:
            claimName: {{ default (include "orb-generation.fullname" $) .Values.s3Mount.sharedClaimName }}
      {{- with .Values.volumes }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.retrievalLayer.strictAntiAffinity }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: "app.kubernetes.io/name"
                    operator: In
                    values:
                      - {{ include "orb-generation.name" . }}-retrieval-layer
              topologyKey: "kubernetes.io/hostname"
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: "app.kubernetes.io/name"
                      operator: In
                      values:
                        - {{ include "orb-generation.name" . }}-retrieval-layer
                topologyKey: "kubernetes.io/hostname"
        {{- end }}
        {{- with .Values.retrievalLayer.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.retrievalLayer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}