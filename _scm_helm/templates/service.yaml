{{- if .Values.embeddingLayer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orb-generation.fullname" . }}-embedding-layer
  labels:
    {{- include "orb-generation.labels" . | nindent 4 }}
    module: embedding-layer
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "orb-generation.selectorLabels" . | nindent 4 }}
    module: embedding-layer
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orb-generation.fullname" . }}-ui
  labels:
    {{- include "orb-generation.labels" . | nindent 4 }}
    module: ui
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "orb-generation.selectorLabels" . | nindent 4 }}
    module: ui
---
