---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orb-generation.fullname" . }}-ui
  labels:
    {{- include "orb-generation.labels" . | nindent 4 }}
    module: ui
spec:
  {{- if not .Values.embeddingLayer.autoscaling.enabled }}
  replicas: {{ .Values.embeddingLayer.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "orb-generation.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "orb-generation.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        module: ui
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "orb-generation.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ui
          command:
            - python3
            - ./ui.py
          env:
            - name: CPU_LIMIT
              value: "{{ .Values.embeddingLayer.resources.limits.cpu | default 2 }}"
            - name: DOCLING_ARTIFACTS_PATH
              value: "{{ .Values.embeddingLayer.doclingCache }}"
          envFrom:
            - secretRef:
                name: {{ .Values.appSecretsName }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.embeddingLayer.image.repository }}:{{ .Values.embeddingLayer.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.embeddingLayer.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.embeddingLayer.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/orb-generation
            - name: shared-volume
              mountPath: /shared
            - name: shared-volume
              mountPath: /models
            - name: model-cache
              mountPath: /local/models
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.configName }}
        - name: shared-volume
          persistentVolumeClaim:
            claimName: {{ default (include "orb-generation.fullname" $) .Values.s3Mount.sharedClaimName }}
        - name: model-cache
          emptyDir: {}
      {{- with .Values.volumes }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.embeddingLayer.strictAntiAffinity }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: "app.kubernetes.io/name"
                    operator: In
                    values:
                      - {{ include "orb-generation.name" . }}-ui
              topologyKey: "kubernetes.io/hostname"
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: "app.kubernetes.io/name"
                      operator: In
                      values:
                        - {{ include "orb-generation.name" . }}-ui
                topologyKey: "kubernetes.io/hostname"
        {{- end }}
        {{- with .Values.embeddingLayer.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.embeddingLayer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}