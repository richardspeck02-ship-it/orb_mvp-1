# Default values for orb-generation.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

s3Mount:
  sharedBucketName: "demo-runbook"
  sharedVolumeHandle: s3-volume-handle
  sharedVolumeName: s3-volume
  sharedClaimName: s3-volume-claim
  inputBucketName: "orb-generation-pilot-transcend-im"
  inputVolumeHandle: s3-volume-handle-input
  inputVolumeName: s3-volume-input
  inputClaimName: s3-volume-claim-input
  mountOptions:
    - allow-delete
    - region us-east-1
    - aws-max-attempts 5
    - uid=1000
    - gid=1000
    - allow-other

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
configName: app-config
serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

reclaimer:
  enabled: false
  resources: {}
  affinity: {}
  tolerations: {}
  replicaCount: 1

embeddingLayer:
  enabled: true
  image:
    repository: jfof-docker.artifactrepo.jnj.com/orb-gen-embed
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  resources: {}
  autoscaling:
    enabled: false
  affinity: {}
  replicaCount: 1
  strictAntiAffinity: false
  tolerations: {}
  podDisruptionBudget: {}
  livenessProbe:
    httpGet:
      path: /ping
      port: http
  readinessProbe:
    httpGet:
      path: /ping
      port: http

generationLayer:
  enabled: true
  image:
    repository: jfof-docker.artifactrepo.jnj.com/orb-gen-write
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  resources: {}
  autoscaling:
    enabled: false
  affinity: {}
  replicaCount: 1
  strictAntiAffinity: false
  tolerations: {}
  podDisruptionBudget: {}
  livenessProbe:
    httpGet:
      path: /ping
      port: http
  readinessProbe:
    httpGet:
      path: /ping
      port: http

retrievalLayer:
  enabled: true
  image:
    repository: jfof-docker.artifactrepo.jnj.com/orb-gen-retrieval
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  resources: {}
  autoscaling:
    enabled: false
  affinity: {}
  replicaCount: 1
  strictAntiAffinity: false
  tolerations: {}
  podDisruptionBudget: {}
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
strictAntiAffinity: true

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

#podSecurityContext:
#  runAsUser: 1024
#  runAsGroup: 1024
#  fsGroup: 1024
#
#securityContext:
#  capabilities:
#    drop:
#      - ALL
#  readOnlyRootFilesystem: true
#  runAsNonRoot: true
#  runAsUser: 1024

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #   - secretName: chart-example-tls
  #     hosts:
  #       - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
appSecretsName: "app-secrets"
# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

preprocessingLayer:
  enabled: true
  image:
    repository: jfof-docker.artifactrepo.jnj.com/orb-generation-preprocessing
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  resources: {}
  autoscaling:
    enabled: false
  affinity: {}
  replicaCount: 1
  strictAntiAffinity: false
  tolerations: {}
  podDisruptionBudget: {}
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
  readinessProbe:
    httpGet:
      path: /healthz
      port: http

podDisruptionBudget: {}
jnjAppID: "APP000"

config: {}
