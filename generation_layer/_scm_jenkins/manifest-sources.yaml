---
version: "1.0"
sources:
  - name: global-manifest
    location:
      locationType: project
      file: _scm_jenkins/manifest.yaml
    manifest:
      type: simple
      path: common
      required: true
  - name: generation-layer-manifest
    location:
      locationType: project
      file: generation_layer/_scm_jenkins/manifest.yaml
    manifest:
      type: simple
      path: common
      required: true
  - name: generation-layer-environment
    location:
      locationType: project
      file: generation_layer/_scm_jenkins/manifest.yaml
    manifest:
      type: by-environment
      path: environments
      required: true
