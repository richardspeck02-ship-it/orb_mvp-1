FAILURE: 10

UNSTABLE: 5

MAJOR:

FAILURE: 20

UNSTABLE: 10

MINOR:

FAILURE: 20

UNSTABLE: 10

INFO:

FAILURE: 20

UNSTABLE: 5

QUALITY_GATE:

