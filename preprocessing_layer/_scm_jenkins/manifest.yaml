## Pipeline details across environments (defaults) retrigger
common:
pipelineType: app-dev
debug: true
unitTest:
type: pytest
coverageDirs: src
docker Image: jnj.artifactrepo.jnj.com/python:3.11.5-alpine
dir: project
pytestCommand: "python pytest cove.cov-report-xml-cov-report-term-missing"
installRequirements: true
installRequirementsCommand: pip install -U pip && pip install -r requirements.txt'
lint:
type: pylint
docker Image: jnj.artifactrepo.jnj.com/python:3.11.5-alpine
installRequirements: true
installRequirementsCommand: pip install -U pip && pip install requirements.txt
FailUnder: 8
pylintModules:
 -src

staticAnalysis:

type: multi

stages:

sonar:

coverageCleanup:

coverage.xml

enabled: true

type: sonar

shortLivedAnalysis: true

longLivedAnalysis: true

